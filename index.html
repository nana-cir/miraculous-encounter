<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>きせきとのであい</title>
<style>
  :root{
    --bg:#eef3f6;
    --card:#ffffff;
    --text:#1b1f24;
    --muted:#6c7a89;
    --shadow:0 10px 28px rgba(0,0,0,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app{ height:100dvh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px calc(10px + env(safe-area-inset-top));
    gap:10px; user-select:none;
  }
  .topbar .tiny{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .pill{
    background:rgba(255,255,255,.72);
    border:1px solid rgba(0,0,0,.06);
    padding:6px 10px; border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .sceneWrap{ position:relative; flex:1; padding:0 12px 12px; }
  .scene{
    position:relative; height:100%;
    border-radius:var(--radius);
    overflow:hidden; box-shadow: var(--shadow);
    border:1px solid rgba(0,0,0,.06);
    background: linear-gradient(180deg, #dcecff 0%, #eaf7ef 45%, #d9ead0 100%);
  }

  /* Camera layer to make "zoom" visually clear */
  .cam{
    position:absolute; inset:-8%;
    transform: scale(1.00);
    transition: transform .35s ease;
    will-change: transform;
  }
  .scene.zoom1 .cam{ transform: scale(1.00); }
  .scene.zoom2 .cam{ transform: scale(1.10); }
  .scene.zoom3 .cam{ transform: scale(1.22); }

  .scene.day .cam{ filter: saturate(1) brightness(1); }
  .scene.night .cam{ filter: saturate(.92) brightness(.95); }

  /* Background details */
  .skyGlow{
    position:absolute; inset:0;
    background:
      radial-gradient(1200px 480px at 50% 82%, rgba(255,255,255,.78), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .trees{
    position:absolute; left:-10%; top:8%;
    width:120%; height:46%;
    background:
      radial-gradient(220px 150px at 18% 62%, rgba(0,0,0,.06), rgba(0,0,0,0) 70%),
      radial-gradient(260px 160px at 85% 58%, rgba(0,0,0,.05), rgba(0,0,0,0) 70%);
    pointer-events:none;
  }
  .rock{
    position:absolute; bottom:18%; left:10%;
    width:140px; height:90px;
    background:linear-gradient(180deg,#b8c0c8,#9aa3ad);
    border-radius:30px 32px 22px 28px;
    opacity:.92;
  }
  .rock:after{
    content:""; position:absolute; right:-22px; top:18px;
    width:76px; height:54px;
    background:linear-gradient(180deg,#c6cdd5,#9aa3ad);
    border-radius:22px; opacity:.86;
  }
  .bush{
    position:absolute; bottom:18%; right:10%;
    width:150px; height:96px;
    background:linear-gradient(180deg,#cfe7c4,#a8cf9f);
    border-radius:44px 44px 34px 34px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.05);
    opacity:.92;
  }
  .grass{
    position:absolute; bottom:-36px; left:-20px;
    width:110%; height:38%;
    background:
      radial-gradient(900px 220px at 50% 10%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.04)),
      linear-gradient(180deg,#d8e9c8,#cfe2be);
    border-top-left-radius:36px;
    border-top-right-radius:36px;
  }

  /* Animal placeholder */
  .animal{
    position:absolute;
    left:62%; top:55%;
    transform:translate(-50%,-50%) scale(1);
    font-size:56px;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    transition: left .9s ease, top .9s ease, opacity .25s ease;
    user-select:none; pointer-events:none;
  }

  /* Status line */
  .status{
    position:absolute; left:0; right:0; bottom:14px;
    display:flex; justify-content:center; pointer-events:none;
  }
  .status .msg{
    max-width:92%;
    background:rgba(255,255,255,.80);
    border:1px solid rgba(0,0,0,.06);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    padding:10px 14px; border-radius:999px;
    color:#223; font-size:14px;
    opacity:0; transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .status .msg.show{ opacity:1; transform:translateY(0); }

  /* Controls */
  .controls{
    position:absolute; right:10px; bottom:78px;
    display:flex; flex-direction:column; gap:8px;
  }
  .iconBtn{
    width:44px; height:44px; border-radius:14px;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    display:grid; place-items:center;
    font-size:18px; color:#234;
    user-select:none;
  }
  .iconBtn:active{ transform:scale(.98); }

  .bookBtn{
    position:absolute; left:10px; bottom:78px;
    width:44px;height:44px; border-radius:14px;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    display:none; place-items:center;
    font-size:18px; user-select:none;
  }
  .bookBtn.show{ display:grid; }

  /* Overlays */
  .overlay{
    position:absolute; inset:0;
    background:rgba(10,20,30,.45);
    display:none; align-items:center; justify-content:center;
    padding:18px;
  }
  .overlay.show{ display:flex; }
  .panel{
    width:min(520px, 100%);
    background:var(--card);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    border:1px solid rgba(0,0,0,.08);
    overflow:hidden;
  }
  .panelHeader{
    padding:14px 16px; display:flex;
    justify-content:space-between; align-items:center;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .panelHeader .title{ font-weight:750; letter-spacing:.2px; }
  .closeBtn{
    border:0; background:transparent;
    font-size:18px; padding:8px 10px;
    border-radius:12px;
  }
  .closeBtn:active{ background:rgba(0,0,0,.06); }
  .panelBody{ padding:14px 16px 16px; }
  .muted{ color:var(--muted); font-size:13px; line-height:1.55; }
  .bigLine{ font-size:15px; line-height:1.6; margin:0 0 14px; }

  .primary{
    width:100%; border:0; border-radius:16px;
    padding:12px 14px; font-size:15px; font-weight:700;
    background:#1f6feb; color:white;
    box-shadow:0 10px 20px rgba(31,111,235,.25);
  }
  .primary:active{ transform:scale(.99); }

  /* Encyclopedia */
  .cardRow{
    border:1px solid rgba(0,0,0,.08);
    border-radius:16px;
    padding:12px 12px;
    display:flex; gap:12px;
    align-items:center;
    margin:10px 0;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75));
  }
  .cardRow.lockedCard{ opacity:.55; }
  .sil{
    width:46px;height:46px; border-radius:14px;
    background:linear-gradient(180deg,#2b3440,#0f141a);
    opacity:.88;
    display:grid; place-items:center;
    color:#fff; font-size:16px;
  }
  .rowMain{ flex:1; }
  .rowMain .name{ font-weight:750; }
  .dots{ display:flex; gap:6px; }
  .dot{ width:8px;height:8px;border-radius:999px; background:rgba(0,0,0,.18); }
  .dot.on{ background:#1f6feb; }

  .entry{
    border:1px solid rgba(0,0,0,.08);
    border-radius:16px;
    padding:12px; margin:10px 0;
    background:#fff;
  }
  .entry h4{ margin:0 0 6px; font-size:14px; letter-spacing:.2px; }
  .entry p{ margin:0; font-size:14px; line-height:1.6; color:#223; }
  .locked{ color:rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tiny">
      <span class="pill" id="weather">🌬</span>
      <span class="pill" id="clock">🕒 DAY 1</span>
    </div>
    <div class="tiny">
      <span class="pill" id="encounterPill">……</span>
    </div>
  </div>

  <div class="sceneWrap">
    <div class="scene zoom1 day" id="scene">
      <div class="cam" id="cam">
        <div class="skyGlow"></div>
        <div class="trees"></div>
        <div class="rock" id="rock"></div>
        <div class="bush" id="bush"></div>
        <div class="grass"></div>

        <div class="animal" id="animal" aria-hidden="true">😾</div>

        <div class="status"><div class="msg" id="statusMsg"> </div></div>

        <div class="controls" aria-label="controls">
          <div class="iconBtn" id="zoomOut" title="離れる">−</div>
          <div class="iconBtn" id="zoomIn" title="近づく">＋</div>
        </div>

        <div class="bookBtn" id="bookBtn" title="図鑑">📘</div>

        <!-- Escape overlay -->
        <div class="overlay" id="escapeOverlay">
          <div class="panel">
            <div class="panelHeader">
              <div class="title">……</div>
              <button class="closeBtn" id="escapeClose" aria-label="close">×</button>
            </div>
            <div class="panelBody">
              <p class="bigLine" id="escapeLine">気配がしなくなった</p>
              <p class="muted" id="escapeHint">（次は別の出会いになるかもしれない）</p>
              <button class="primary" id="restartBtn">最初からやり直す</button>
            </div>
          </div>
        </div>

        <!-- Encyclopedia overlay -->
        <div class="overlay" id="bookOverlay">
          <div class="panel">
            <div class="panelHeader">
              <div class="title">図鑑</div>
              <button class="closeBtn" id="bookClose" aria-label="close">×</button>
            </div>
            <div class="panelBody">
              <div class="cardRow" id="cardManul">
                <div class="sil">？</div>
                <div class="rowMain">
                  <div class="name" id="nameManul">？？？</div>
                  <div class="muted" id="subManul">観察で少しずつ埋まる</div>
                </div>
                <div class="dots" id="dotsManul"></div>
              </div>

              <div class="cardRow lockedCard" id="cardTamarin">
                <div class="sil">？</div>
                <div class="rowMain">
                  <div class="name" id="nameTamarin">金色のサル…？</div>
                  <div class="muted" id="subTamarin">まだ出会っていない</div>
                </div>
                <div class="dots" id="dotsTamarin"></div>
              </div>

              <div class="entry">
                <h4 id="e1Title">距離</h4>
                <p id="e1Text" class="locked">（まだ分からない）</p>
              </div>
              <div class="entry">
                <h4 id="e2Title">安心</h4>
                <p id="e2Text" class="locked">（まだ分からない）</p>
              </div>
              <div class="entry">
                <h4 id="e3Title">きっかけ</h4>
                <p id="e3Text" class="locked">（まだ分からない）</p>
              </div>

              <p class="muted" style="margin-top:10px;">
                ※ 図鑑は“後から”分かる。
              </p>
            </div>
          </div>
        </div>

      </div><!-- /cam -->
    </div><!-- /scene -->
  </div><!-- /sceneWrap -->
</div><!-- /app -->

<script>
(() => {
  // ----------------------------
  // Animals
  // ----------------------------
  const Animals = {
    manul: {
      id: "manul",
      knownName: "マヌルネコだ！",
      unknownName: "？？？",
      emoji: { IDLE:"😾", OBSERVE:"👀", HIDE:"🙈", NATURAL:"😺", ESCAPE:"💨" },
      escapeLine: "マヌルネコの気配がしなくなった",
      // tuning
      approachStress: 16,
      approachAlert: 18,
      naturalStressMax: 30,
      naturalAlertMax: 35,
      waitUnlockDistanceStress: 35,
      text: {
        distance: "近づかれるのが苦手。見守る距離が安心につながる。",
        safe:     "岩陰や草むらは安心材料。隠れられると行動が増える。",
        trigger:  "追いかける／近づきすぎると、気配が消えることがある。"
      }
    },
    tamarin: {
      id: "tamarin",
      knownName: "タマリンだ！",
      unknownName: "金色のサル…？",
      emoji: { IDLE:"🐒", OBSERVE:"👀", HIDE:"🙈", NATURAL:"🙊", ESCAPE:"💨" },
      escapeLine: "金色のサルの気配がしなくなった",
      // tuning (not “meaningless”: its failure trigger differs)
      approachStress: 8,
      approachAlert: 10,
      naturalStressMax: 40,
      naturalAlertMax: 45,
      waitUnlockDistanceStress: 45,
      text: {
        distance: "近すぎるのも、放置しすぎるのも不安につながる。",
        safe:     "“気配”が安定すると落ち着く。急な刺激が続くと散る。",
        trigger:  "反応が続くと群れが散り、気配が消えることがある。"
      }
    }
  };

  // ----------------------------
  // Global (knowledge persists)
  // ----------------------------
  const S = {
    // session
    current: "manul",
    zoom: 1,
    stress: 15,
    alert: 10,
    mode: "IDLE",
    lastActionAt: Date.now(),
    tapBurst: 0,
    tapBurstTimer: null,
    seenNatural: 0,

    // day/achievement
    day: 1,
    isNight: false,
    milestones: { d3:false, d7:false },

    // knowledge
    known: { manul: true, tamarin: false }, // after “condition clear” we show known name
    met:   { manul: true, tamarin: false }, // encountered at least once
    escapedOnce: { manul: false, tamarin: false },
    unlock: {
      manul: { distance:false, safe:false, trigger:false },
      tamarin:{ distance:false, safe:false, trigger:false }
    }
  };

  // ----------------------------
  // DOM
  // ----------------------------
  const scene = document.getElementById("scene");
  const animal = document.getElementById("animal");
  const statusMsg = document.getElementById("statusMsg");
  const zoomIn = document.getElementById("zoomIn");
  const zoomOut = document.getElementById("zoomOut");
  const bookBtn = document.getElementById("bookBtn");
  const encounterPill = document.getElementById("encounterPill");

  const rock = document.getElementById("rock");
  const bush = document.getElementById("bush");

  const weather = document.getElementById("weather");
  const clock = document.getElementById("clock");

  const escapeOverlay = document.getElementById("escapeOverlay");
  const escapeLine = document.getElementById("escapeLine");
  const escapeHint = document.getElementById("escapeHint");
  const restartBtn = document.getElementById("restartBtn");
  const escapeClose = document.getElementById("escapeClose");

  const bookOverlay = document.getElementById("bookOverlay");
  const bookClose = document.getElementById("bookClose");

  const cardManul = document.getElementById("cardManul");
  const cardTamarin = document.getElementById("cardTamarin");
  const nameManul = document.getElementById("nameManul");
  const nameTamarin = document.getElementById("nameTamarin");
  const subManul = document.getElementById("subManul");
  const subTamarin = document.getElementById("subTamarin");
  const dotsManul = document.getElementById("dotsManul");
  const dotsTamarin = document.getElementById("dotsTamarin");

  const e1Text = document.getElementById("e1Text");
  const e2Text = document.getElementById("e2Text");
  const e3Text = document.getElementById("e3Text");

  // ----------------------------
  // Helpers
  // ----------------------------
  const clamp = (n,min,max) => Math.max(min, Math.min(max, n));
  const nowMs = () => Date.now();
  const cur = () => Animals[S.current];

  let msgTimer=null;
  function flashMsg(text, ms=1400){
    statusMsg.textContent = text;
    statusMsg.classList.add("show");
    clearTimeout(msgTimer);
    msgTimer = setTimeout(()=>statusMsg.classList.remove("show"), ms);
  }

  function setZoom(z){
    S.zoom = clamp(z, 1, 3);
    scene.classList.toggle("zoom1", S.zoom===1);
    scene.classList.toggle("zoom2", S.zoom===2);
    scene.classList.toggle("zoom3", S.zoom===3);

    // Visual hint
    if(S.zoom===1) flashMsg("離れて見守る", 900);
    if(S.zoom===3) flashMsg("近すぎるかも", 900);
  }

  function setDayNight(isNight){
    S.isNight = isNight;
    scene.classList.toggle("night", isNight);
    scene.classList.toggle("day", !isNight);
    weather.textContent = isNight ? "🌙" : "🌬";
    clock.textContent = `🕒 DAY ${S.day}`;
  }

  function maybeAdvanceDay(){
    // Slow day progression (for MVP)
    // Every ~40s of real time => +1 day
    // (You can tune later)
    if(!S._dayStartAt) S._dayStartAt = nowMs();
    const elapsed = (nowMs() - S._dayStartAt)/1000;
    if(elapsed > 40){
      S.day += 1;
      S._dayStartAt = nowMs();
      flashMsg(`DAY ${S.day}`, 1200);
      // Achievements
      if(S.day >= 3 && !S.milestones.d3){
        S.milestones.d3 = true;
        flashMsg("実績：3日見守った", 1500);
      }
      if(S.day >= 7 && !S.milestones.d7){
        S.milestones.d7 = true;
        flashMsg("実績：7日見守った", 1500);
      }
    }
    clock.textContent = `🕒 DAY ${S.day}`;
  }

  function setSpriteByMode(){
    animal.textContent = cur().emoji[S.mode] || "？";
  }

  function randomMove(){
    // Keep away from dead center
    const x = clamp(55 + (Math.random()*30 - 15), 18, 82);
    const y = clamp(54 + (Math.random()*26 - 13), 24, 80);
    animal.style.left = x + "%";
    animal.style.top  = y + "%";
  }

  function distPercentTo(el){
    // Approx distance from animal center to element center (0..100)
    const a = animal.getBoundingClientRect();
    const b = el.getBoundingClientRect();
    const ax = a.left + a.width/2;
    const ay = a.top  + a.height/2;
    const bx = b.left + b.width/2;
    const by = b.top  + b.height/2;
    const dx = ax - bx;
    const dy = ay - by;
    const d  = Math.sqrt(dx*dx + dy*dy);
    // normalize by viewport diagonal
    const vw = window.innerWidth, vh = window.innerHeight;
    const diag = Math.sqrt(vw*vw + vh*vh);
    return clamp((d/diag)*100, 0, 100);
  }

  function hideHint(){
    // If close to rock => rock hint; else bush hint
    const dr = distPercentTo(rock);
    const db = distPercentTo(bush);
    if(dr < 18) return "いわかげにかくれた";
    if(db < 18) return "しげみにいるかも";
    return "どこかにいる";
  }

  function showEncounterName(){
    const a = cur();
    // Known/unknown naming logic
    if(S.known[S.current]) encounterPill.textContent = a.knownName;
    else encounterPill.textContent = a.unknownName;
  }

  function showBookIfAnyEscape(){
    if(S.escapedOnce.manul || S.escapedOnce.tamarin){
      bookBtn.classList.add("show");
    }
  }

  // ----------------------------
  // Encyclopedia
  // ----------------------------
  function dotCount(id){
    const u = S.unlock[id];
    return (u.distance?1:0) + (u.safe?1:0) + (u.trigger?1:0);
  }
  function renderDots(el, id){
    el.innerHTML = "";
    const c = dotCount(id);
    for(let i=0;i<3;i++){
      const d = document.createElement("div");
      d.className = "dot" + (i < c ? " on":"");
      el.appendChild(d);
    }
  }
  function renderEncyclopedia(focusId = S.current){
    // Names (Route A)
    nameManul.textContent = S.known.manul ? "マヌルネコ" : "？？？";
    nameTamarin.textContent = S.known.tamarin ? "タマリン" : "金色のサル…？";

    subManul.textContent = "観察で少しずつ埋まる";
    subTamarin.textContent = S.met.tamarin ? "観察で少しずつ埋まる" : "まだ出会っていない";

    cardTamarin.classList.toggle("lockedCard", !S.met.tamarin);

    renderDots(dotsManul, "manul");
    renderDots(dotsTamarin, "tamarin");

    const unlocked = S.unlock[focusId];
    const txt = Animals[focusId].text;

    if(unlocked.distance){
      e1Text.classList.remove("locked");
      e1Text.textContent = txt.distance;
    }else{
      e1Text.classList.add("locked");
      e1Text.textContent = "（まだ分からない）";
    }

    if(unlocked.safe){
      e2Text.classList.remove("locked");
      e2Text.textContent = txt.safe;
    }else{
      e2Text.classList.add("locked");
      e2Text.textContent = "（まだ分からない）";
    }

    if(unlocked.trigger){
      e3Text.classList.remove("locked");
      e3Text.textContent = txt.trigger;
    }else{
      e3Text.classList.add("locked");
      e3Text.textContent = "（まだ分からない）";
    }
  }

  cardManul.addEventListener("click", () => renderEncyclopedia("manul"));
  cardTamarin.addEventListener("click", () => { if(S.met.tamarin) renderEncyclopedia("tamarin"); });

  // ----------------------------
  // Encounter system (NO manual switch)
  // ----------------------------
  function pickNextAnimal(){
    // Default is manul; after some progress, tamarin may appear.
    // If tamarin not met, 30% chance after restart; once met, 50/50.
    if(!S.met.tamarin){
      return (Math.random() < 0.30) ? "tamarin" : "manul";
    }
    return (Math.random() < 0.50) ? "tamarin" : "manul";
  }

  function registerAction(){
    S.lastActionAt = nowMs();
  }

  function doEscape(){
    S.mode = "ESCAPE";

    // knowledge unlock: trigger on escape
    S.unlock[S.current].trigger = true;
    S.escapedOnce[S.current] = true;

    // vanish & show hint
    animal.style.opacity = "0";
    setSpriteByMode();

    setTimeout(() => {
      escapeLine.textContent = cur().escapeLine;
      escapeHint.textContent = `（${hideHint()}）`;
      escapeOverlay.classList.add("show");
      showBookIfAnyEscape();
      renderEncyclopedia();
    }, 420);
  }

  function restart(){
    // Choose encounter (random)
    const next = pickNextAnimal();
    S.current = next;
    S.met[next] = true;

    // If player “clears condition”, mark known (simple MVP rule)
    // Rule: if you observed NATURAL at least once AND haven't escaped within the last 20s -> known
    if(S._clearedThisRun){
      S.known[next] = true;
    }
    S._clearedThisRun = false;

    // Reset session params
    escapeOverlay.classList.remove("show");
    animal.style.opacity = "1";

    S.zoom = 1;
    S.stress = (next==="manul") ? 15 : 20;
    S.alert  = (next==="manul") ? 10 : 14;
    S.mode   = "IDLE";
    S.tapBurst = 0;
    S.seenNatural = 0;
    S.lastActionAt = nowMs();

    setZoom(1);
    randomMove();
    showEncounterName();
    setSpriteByMode();
    showBookIfAnyEscape();

    // Small intro message
    if(S.known[next]){
      flashMsg(cur().knownName, 1400);
    }else{
      flashMsg(cur().unknownName, 1400);
    }
  }

  function approach(){
    if(S.mode==="ESCAPE") return;
    registerAction();

    setZoom(S.zoom + 1);

    // close => risk
    S.stress = clamp(S.stress + cur().approachStress, 0, 100);
    S.alert  = clamp(S.alert  + cur().approachAlert, 0, 100);

    // Tap burst means chasing / “touching”
    S.tapBurst++;
    clearTimeout(S.tapBurstTimer);
    S.tapBurstTimer = setTimeout(()=>S.tapBurst=0, 900);

    // Fail conditions differ per animal
    if(S.current==="manul"){
      if(S.tapBurst >= 3 && S.zoom >= 2) S.stress = clamp(S.stress + 26, 0, 100);
      if(S.stress > 80 || (S.tapBurst >= 4 && S.zoom >= 2)) doEscape();
    }else{
      // tamarin: “reaction continues” => group scatters
      if(S.tapBurst >= 5 && S.zoom >= 2) S.alert = clamp(S.alert + 25, 0, 100);
      if(S.alert > 80) doEscape();
    }
  }

  function stepBack(){
    if(S.mode==="ESCAPE") return;
    registerAction();
    setZoom(S.zoom - 1);
    S.stress = clamp(S.stress - 8, 0, 100);
    S.alert  = clamp(S.alert  - 8, 0, 100);
  }

  // ----------------------------
  // AI tick
  // ----------------------------
  function tick(){
    const noActionSec = (nowMs() - S.lastActionAt)/1000;

    if(S.mode !== "ESCAPE"){
      // Calm down if waiting
      if(noActionSec > 18){
        S.stress = clamp(S.stress - 8, 0, 100);
        S.alert  = clamp(S.alert  - 10, 0, 100);

        // tamarin: too long neglect => uneasy
        if(S.current==="tamarin" && noActionSec > 35){
          S.alert = clamp(S.alert + 10, 0, 100);
          if(Math.random() < 0.02) flashMsg("落ち着かない");
        }

        // unlock distance by learning to wait
        if(!S.unlock[S.current].distance && S.stress < cur().waitUnlockDistanceStress){
          S.unlock[S.current].distance = true;
          flashMsg("落ち着いている");
        }

        // unlock safe/group
        if(!S.unlock[S.current].safe && noActionSec > 24){
          S.unlock[S.current].safe = true;
        }
      }

      // Determine mode
      if(S.alert > 60){
        S.mode = "HIDE";
      } else if(S.stress < cur().naturalStressMax && S.alert < cur().naturalAlertMax && noActionSec > 10){
        S.mode = "NATURAL";
      } else if(S.alert > 30){
        S.mode = "OBSERVE";
      } else {
        S.mode = "IDLE";
      }

      // Natural behavior: move + “condition clear” for known reveal
      if(S.mode === "NATURAL"){
        S.seenNatural += 0.02;
        if(S.seenNatural > 0.8){
          // Mark this run as “cleared”
          S._clearedThisRun = true;

          // Make it feel alive
          if(Math.random() < 0.35){
            randomMove();
          }
          if(Math.random() < 0.10){
            flashMsg("自然な行動が増えている");
          }
          S.seenNatural = 0;
        }
      }

      // Hide behavior: move into rock/bush sometimes + message
      if(S.mode === "HIDE" && Math.random() < 0.02){
        const goRock = Math.random() < 0.5;
        if(goRock){
          animal.style.left = "18%";
          animal.style.top  = "64%";
          flashMsg("いわかげにかくれた", 1200);
        }else{
          animal.style.left = "82%";
          animal.style.top  = "64%";
          flashMsg("しげみにいるかも", 1200);
        }
      }
    }

    // Cosmetic day/night toggle occasionally
    if(Math.random() < 0.0018){
      setDayNight(!S.isNight);
      if(S.isNight) S.alert = clamp(S.alert + 8, 0, 100);
    }

    // Day counter / achievements
    maybeAdvanceDay();

    setSpriteByMode();
    showBookIfAnyEscape();

    requestAnimationFrame(tick);
  }

  // ----------------------------
  // Events
  // ----------------------------
  scene.addEventListener("pointerdown", (e) => {
    if(escapeOverlay.classList.contains("show")) return;
    if(bookOverlay.classList.contains("show")) return;

    const t = e.target;
    if(t === zoomIn || t === zoomOut || t === bookBtn) return;
    approach();
  }, {passive:true});

  zoomIn.addEventListener("click", (e)=>{ e.stopPropagation(); approach(); });
  zoomOut.addEventListener("click",(e)=>{ e.stopPropagation(); stepBack(); });

  restartBtn.addEventListener("click", restart);
  escapeClose.addEventListener("click", ()=> escapeOverlay.classList.remove("show"));

  bookBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    renderEncyclopedia();
    bookOverlay.classList.add("show");
  });
  bookClose.addEventListener("click",()=> bookOverlay.classList.remove("show"));

  // ----------------------------
  // Init
  // ----------------------------
  setDayNight(false);
  setZoom(1);
  randomMove();
  showEncounterName();
  setSpriteByMode();
  renderEncyclopedia();

  // Start with manul but unknown reveal works later
  flashMsg("（タップ＝近づく / −で離れる）", 1700);

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

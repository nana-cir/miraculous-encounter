<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Miracle encounter</title>
<style>
  :root{
    --bg:#eef3f6;
    --card:#ffffff;
    --text:#1b1f24;
    --muted:#6c7a89;
    --shadow:0 10px 28px rgba(0,0,0,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app{ height:100dvh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px calc(10px + env(safe-area-inset-top));
    gap:10px; user-select:none;
  }
  .topbar .tiny{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .pill{
    background:rgba(255,255,255,.7);
    border:1px solid rgba(0,0,0,.06);
    padding:6px 10px; border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,.04);
  }

  .sceneWrap{ position:relative; flex:1; padding:0 12px 12px; }
  .scene{
    position:relative; height:100%;
    border-radius:var(--radius);
    background:
      radial-gradient(1200px 480px at 50% 80%, rgba(255,255,255,.8), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #dcecff 0%, #eaf7ef 45%, #d9ead0 100%);
    overflow:hidden; box-shadow: var(--shadow);
    border:1px solid rgba(0,0,0,.06);
    transition: filter .35s ease, background .35s ease;
  }

  .scene.day{ }
  .scene.night{
    background:
      radial-gradient(1200px 480px at 50% 80%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #bccbe6 0%, #d8eadf 45%, #c9dcc0 100%);
    filter: saturate(.9) brightness(.95);
  }

  /* Background objects */
  .rock{
    position:absolute; bottom:16%; left:12%;
    width:130px; height:84px;
    background:linear-gradient(180deg,#b8c0c8,#9aa3ad);
    border-radius:28px 30px 22px 26px;
    opacity:.9;
  }
  .rock:after{
    content:""; position:absolute; right:-18px; top:18px;
    width:68px; height:48px;
    background:linear-gradient(180deg,#c6cdd5,#9aa3ad);
    border-radius:22px; opacity:.85;
  }
  .trees{
    position:absolute;
    left:-10%; top:10%;
    width:120%; height:45%;
    background:
      radial-gradient(180px 120px at 15% 65%, rgba(0,0,0,.06), rgba(0,0,0,0) 70%),
      radial-gradient(220px 140px at 85% 58%, rgba(0,0,0,.05), rgba(0,0,0,0) 70%);
    pointer-events:none;
  }
  .grass{
    position:absolute; bottom:-30px; left:-20px;
    width:110%; height:36%;
    background:
      radial-gradient(900px 220px at 50% 10%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.04)),
      linear-gradient(180deg,#d8e9c8,#cfe2be);
    border-top-left-radius:36px;
    border-top-right-radius:36px;
  }

  /* Animal sprite placeholder */
  .animal{
    position:absolute;
    left:62%; top:55%;
    transform:translate(-50%,-50%) scale(1);
    font-size:52px;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    transition: transform .35s ease, left .9s ease, top .9s ease, opacity .25s ease;
    user-select:none; pointer-events:none;
  }

  /* Camera zoom simulation */
  .scene.zoom1 .animal{ transform:translate(-50%,-50%) scale(1.05); }
  .scene.zoom2 .animal{ transform:translate(-50%,-50%) scale(1.20); }
  .scene.zoom3 .animal{ transform:translate(-50%,-50%) scale(1.38); }

  /* One-line status */
  .status{
    position:absolute; left:0; right:0; bottom:14px;
    display:flex; justify-content:center; pointer-events:none;
  }
  .status .msg{
    max-width:92%;
    background:rgba(255,255,255,.78);
    border:1px solid rgba(0,0,0,.06);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    padding:10px 14px; border-radius:999px;
    color:#223; font-size:14px;
    opacity:0; transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .status .msg.show{ opacity:1; transform:translateY(0); }

  /* Tiny controls */
  .controls{
    position:absolute; right:10px; bottom:78px;
    display:flex; flex-direction:column; gap:8px;
  }
  .iconBtn{
    width:44px; height:44px; border-radius:14px;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    display:grid; place-items:center;
    font-size:18px; color:#234;
    user-select:none;
  }
  .iconBtn:active{ transform:scale(.98); }

  .bookBtn{
    position:absolute; left:10px; bottom:78px;
    width:44px;height:44px; border-radius:14px;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    display:none; place-items:center;
    font-size:18px; user-select:none;
  }
  .bookBtn.show{ display:grid; }

  .switchBtn{
    position:absolute; left:10px; bottom:26px;
    height:44px; padding:0 12px;
    border-radius:14px;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    display:grid; place-items:center;
    font-size:13px; color:#234;
    user-select:none;
  }
  .switchBtn:active{ transform:scale(.99); }

  /* Overlays */
  .overlay{
    position:absolute; inset:0;
    background:rgba(10,20,30,.45);
    display:none; align-items:center; justify-content:center;
    padding:18px;
  }
  .overlay.show{ display:flex; }
  .panel{
    width:min(520px, 100%);
    background:var(--card);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    border:1px solid rgba(0,0,0,.08);
    overflow:hidden;
  }
  .panelHeader{
    padding:14px 16px; display:flex;
    justify-content:space-between; align-items:center;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .panelHeader .title{ font-weight:750; letter-spacing:.2px; }
  .closeBtn{
    border:0; background:transparent;
    font-size:18px; padding:8px 10px;
    border-radius:12px;
  }
  .closeBtn:active{ background:rgba(0,0,0,.06); }
  .panelBody{ padding:14px 16px 16px; }
  .muted{ color:var(--muted); font-size:13px; line-height:1.55; }
  .bigLine{ font-size:15px; line-height:1.6; margin:0 0 14px; }

  .primary{
    width:100%; border:0; border-radius:16px;
    padding:12px 14px; font-size:15px; font-weight:700;
    background:#1f6feb; color:white;
    box-shadow:0 10px 20px rgba(31,111,235,.25);
  }
  .primary:active{ transform:scale(.99); }

  /* Encyclopedia */
  .cardRow{
    border:1px solid rgba(0,0,0,.08);
    border-radius:16px;
    padding:12px 12px;
    display:flex; gap:12px;
    align-items:center;
    margin:10px 0;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.75));
  }
  .cardRow.lockedCard{
    opacity:.55;
  }
  .sil{
    width:46px;height:46px; border-radius:14px;
    background:linear-gradient(180deg,#2b3440,#0f141a);
    opacity:.88;
    display:grid; place-items:center;
    color:#fff; font-size:16px;
  }
  .rowMain{ flex:1; }
  .rowMain .name{ font-weight:750; }
  .dots{ display:flex; gap:6px; }
  .dot{ width:8px;height:8px;border-radius:999px; background:rgba(0,0,0,.18); }
  .dot.on{ background:#1f6feb; }

  .entry{
    border:1px solid rgba(0,0,0,.08);
    border-radius:16px;
    padding:12px; margin:10px 0;
    background:#fff;
  }
  .entry h4{ margin:0 0 6px; font-size:14px; letter-spacing:.2px; }
  .entry p{ margin:0; font-size:14px; line-height:1.6; color:#223; }
  .locked{ color:rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tiny">
      <span class="pill" id="weather">🌬</span>
      <span class="pill" id="clock">🕒 DAY</span>
    </div>
    <div class="tiny">
      <span class="pill" id="titlePill">Manul</span>
    </div>
  </div>

  <div class="sceneWrap">
    <div class="scene zoom1 day" id="scene">
      <div class="trees"></div>
      <div class="rock"></div>
      <div class="grass"></div>

      <div class="animal" id="animal" aria-hidden="true">😾</div>

      <div class="status"><div class="msg" id="statusMsg"> </div></div>

      <div class="controls" aria-label="controls">
        <div class="iconBtn" id="zoomOut" title="距離をとる">−</div>
        <div class="iconBtn" id="zoomIn" title="近づく">＋</div>
      </div>

      <div class="bookBtn" id="bookBtn" title="図鑑">📘</div>
      <div class="switchBtn" id="switchBtn" title="動物を切替">切替</div>

      <!-- Escape overlay -->
      <div class="overlay" id="escapeOverlay">
        <div class="panel">
          <div class="panelHeader">
            <div class="title">……</div>
            <button class="closeBtn" id="escapeClose" aria-label="close">×</button>
          </div>
          <div class="panelBody">
            <p class="bigLine" id="escapeLine">気配がしなくなった</p>
            <p class="muted">（同じ個体ではない“次の出会い”になります）</p>
            <button class="primary" id="restartBtn">最初からやり直す</button>
          </div>
        </div>
      </div>

      <!-- Encyclopedia overlay -->
      <div class="overlay" id="bookOverlay">
        <div class="panel">
          <div class="panelHeader">
            <div class="title">図鑑</div>
            <button class="closeBtn" id="bookClose" aria-label="close">×</button>
          </div>
          <div class="panelBody">
            <div class="cardRow" id="cardA">
              <div class="sil">？</div>
              <div class="rowMain">
                <div class="name" id="nameA">？？？</div>
                <div class="muted" id="subA">観察で少しずつ埋まる</div>
              </div>
              <div class="dots" id="dotsA"></div>
            </div>

            <div class="cardRow lockedCard" id="cardB">
              <div class="sil">？</div>
              <div class="rowMain">
                <div class="name" id="nameB">？？？</div>
                <div class="muted" id="subB">まだ出会っていない</div>
              </div>
              <div class="dots" id="dotsB"></div>
            </div>

            <div class="entry">
              <h4 id="e1Title">距離</h4>
              <p id="e1Text" class="locked">（まだ分からない）</p>
            </div>
            <div class="entry">
              <h4 id="e2Title">かくれ場所 / 群れ</h4>
              <p id="e2Text" class="locked">（まだ分からない）</p>
            </div>
            <div class="entry">
              <h4 id="e3Title">きっかけ</h4>
              <p id="e3Text" class="locked">（まだ分からない）</p>
            </div>

            <p class="muted" style="margin-top:10px;">
              ※ 正解は先に教えない。体験が先に来る。
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(() => {
  // --- Animals config (MVP) ---
  // Note: "name" stays ??? per Route A
  const Animals = {
    A: { // Cat (Manul-like)
      id: "A",
      title: "Manul",
      emoji: { IDLE:"😾", OBSERVE:"👀", HIDE:"🙈", NATURAL:"😺", ESCAPE:"💨" },
      escapeLine: "マヌルネコの気配がしなくなった",
      // Behavior tuning
      // approach close is dangerous
      approachStress: 14,
      approachAlert: 18,
      waitUnlockDistanceStress: 35,
      naturalStressMax: 30,
      naturalAlertMax: 35,
      // Notes for encyclopedia
      text: {
        distance: "近づかれるのが苦手。見守る距離が安心につながる。",
        cover:    "岩陰や草むらは安心材料。隠れられると行動が増える。",
        trigger:  "追いかける／近づきすぎると、気配が消えることがある。"
      }
    },
    B: { // Monkey (Tamarin-like)
      id: "B",
      title: "Field",
      emoji: { IDLE:"🐒", OBSERVE:"👀", HIDE:"🙈", NATURAL:"🙊", ESCAPE:"💨" },
      escapeLine: "サルの気配がしなくなった",
      // Behavior tuning
      // being close isn't instantly fatal, but "neglect" increases alert
      approachStress: 8,
      approachAlert: 10,
      waitUnlockDistanceStress: 45,
      naturalStressMax: 40,
      naturalAlertMax: 45,
      text: {
        distance: "距離は状況次第。近すぎるのも、放置しすぎるのも不安になる。",
        cover:    "単独にしない。落ち着ける場所と“気配”の安定が大事。",
        trigger:  "反応が続くと群れが散り、気配が消えることがある。"
      }
    }
  };

  // --- Global state (knowledge persists across restarts) ---
  const S = {
    animalKey: "A",  // current animal (A/B)
    zoom: 1,         // 1..3
    stress: 15,
    alert: 10,
    mode: "IDLE",
    lastActionAt: Date.now(),
    tapBurst: 0,
    tapBurstTimer: null,
    seenNatural: 0,
    day: true,

    // Knowledge progression
    escapedOnce: { A:false, B:false },
    metOnce:     { A:true,  B:false },  // start with A "met"
    unlock: {
      A: { distance:false, cover:false, trigger:false },
      B: { distance:false, cover:false, trigger:false }
    }
  };

  // --- DOM ---
  const scene = document.getElementById("scene");
  const animal = document.getElementById("animal");
  const statusMsg = document.getElementById("statusMsg");
  const zoomIn = document.getElementById("zoomIn");
  const zoomOut = document.getElementById("zoomOut");
  const bookBtn = document.getElementById("bookBtn");
  const switchBtn = document.getElementById("switchBtn");
  const titlePill = document.getElementById("titlePill");

  const escapeOverlay = document.getElementById("escapeOverlay");
  const restartBtn = document.getElementById("restartBtn");
  const escapeClose = document.getElementById("escapeClose");
  const escapeLine = document.getElementById("escapeLine");

  const bookOverlay = document.getElementById("bookOverlay");
  const bookClose = document.getElementById("bookClose");

  const weather = document.getElementById("weather");
  const clock = document.getElementById("clock");

  const cardA = document.getElementById("cardA");
  const cardB = document.getElementById("cardB");
  const nameA = document.getElementById("nameA");
  const nameB = document.getElementById("nameB");
  const subA  = document.getElementById("subA");
  const subB  = document.getElementById("subB");
  const dotsA = document.getElementById("dotsA");
  const dotsB = document.getElementById("dotsB");

  const e1Text = document.getElementById("e1Text");
  const e2Text = document.getElementById("e2Text");
  const e3Text = document.getElementById("e3Text");

  // --- Helpers ---
  const clamp = (n,min,max) => Math.max(min, Math.min(max, n));

  let msgTimer=null;
  function flashMsg(text, ms=1400){
    statusMsg.textContent = text;
    statusMsg.classList.add("show");
    clearTimeout(msgTimer);
    msgTimer = setTimeout(()=>statusMsg.classList.remove("show"), ms);
  }

  function currentAnimal(){ return Animals[S.animalKey]; }

  function setZoom(z){
    S.zoom = clamp(z,1,3);
    scene.classList.toggle("zoom1", S.zoom===1);
    scene.classList.toggle("zoom2", S.zoom===2);
    scene.classList.toggle("zoom3", S.zoom===3);
  }

  function randomMove(){
    const x = clamp(55 + (Math.random()*30 - 15), 18, 82);
    const y = clamp(52 + (Math.random()*26 - 13), 22, 78);
    animal.style.left = x + "%";
    animal.style.top  = y + "%";
  }

  function setSpriteByMode(){
    const A = currentAnimal();
    animal.textContent = A.emoji[S.mode] || "？";
  }

  function registerAction(){
    S.lastActionAt = Date.now();
  }

  function showBookIfAnyEscape(){
    if(S.escapedOnce.A || S.escapedOnce.B){
      bookBtn.classList.add("show");
    }
  }

  // --- Encyclopedia ---
  function dotCount(key){
    const u = S.unlock[key];
    return (u.distance?1:0) + (u.cover?1:0) + (u.trigger?1:0);
  }
  function renderDots(el, key){
    el.innerHTML="";
    const c = dotCount(key);
    for(let i=0;i<3;i++){
      const d=document.createElement("div");
      d.className="dot"+(i<c?" on":"");
      el.appendChild(d);
    }
  }

  function renderEncyclopedia(){
    // Route A: keep unknown
    nameA.textContent = "？？？";
    nameB.textContent = "？？？";

    subA.textContent = "観察で少しずつ埋まる";
    subB.textContent = S.metOnce.B ? "観察で少しずつ埋まる" : "まだ出会っていない";

    renderDots(dotsA, "A");
    renderDots(dotsB, "B");

    // Card lock visuals
    cardB.classList.toggle("lockedCard", !S.metOnce.B);

    // Show entries for currently selected animal
    const key = S.animalKey;
    const unlocked = S.unlock[key];
    const txt = Animals[key].text;

    if(unlocked.distance){
      e1Text.classList.remove("locked");
      e1Text.textContent = txt.distance;
    }else{
      e1Text.classList.add("locked");
      e1Text.textContent = "（まだ分からない）";
    }

    if(unlocked.cover){
      e2Text.classList.remove("locked");
      e2Text.textContent = txt.cover;
    }else{
      e2Text.classList.add("locked");
      e2Text.textContent = "（まだ分からない）";
    }

    if(unlocked.trigger){
      e3Text.classList.remove("locked");
      e3Text.textContent = txt.trigger;
    }else{
      e3Text.classList.add("locked");
      e3Text.textContent = "（まだ分からない）";
    }
  }

  // Click cards to change encyclopedia focus (doesn't change current field animal)
  cardA.addEventListener("click", () => { S.animalKey = "A"; renderEncyclopedia(); });
  cardB.addEventListener("click", () => {
    if(!S.metOnce.B) return;
    S.animalKey = "B";
    renderEncyclopedia();
  });

  // --- AI tick ---
  function tick(){
    const now = Date.now();
    const noActionSec = (now - S.lastActionAt)/1000;
    const A = currentAnimal();

    // passive calm / (for monkey, too much idling increases alert after a while)
    if(S.mode !== "ESCAPE"){
      if(noActionSec > 18){
        // calm down
        S.stress = clamp(S.stress - 8, 0, 100);
        S.alert  = clamp(S.alert  - 10, 0, 100);

        // Monkey-like: long neglect => uneasy (subtle)
        if(S.animalKey==="B" && noActionSec > 35){
          S.alert = clamp(S.alert + 10, 0, 100);
          if(Math.random() < 0.02) flashMsg("落ち着かない");
        }

        // unlock "distance" by learning to wait (both animals)
        if(!S.unlock[S.animalKey].distance && S.stress < A.waitUnlockDistanceStress){
          S.unlock[S.animalKey].distance = true;
          flashMsg("落ち着いている");
        }

        // unlock "cover/group" after some time in stable state
        if(!S.unlock[S.animalKey].cover && noActionSec > 24){
          S.unlock[S.animalKey].cover = true;
        }
      }

      // Determine mode from thresholds
      if(S.alert > 60){
        S.mode = "HIDE";
      } else if(S.stress < A.naturalStressMax && S.alert < A.naturalAlertMax && noActionSec > 10){
        S.mode = "NATURAL";
      } else if(S.alert > 30){
        S.mode = "OBSERVE";
      } else {
        S.mode = "IDLE";
      }

      // Natural behavior
      if(S.mode === "NATURAL"){
        S.seenNatural += 0.02;
        if(S.seenNatural > 1.2){
          if(Math.random() < 0.02) flashMsg("自然な行動が増えている");
          randomMove();
          S.seenNatural = 0;
        }
      }

      // Hide
      if(S.mode === "HIDE" && Math.random() < 0.01){
        animal.style.left = "20%";
        animal.style.top  = "68%";
        flashMsg("警戒している");
      }
    }

    // Day/night cosmetics
    if(Math.random() < 0.002){
      S.day = !S.day;
      clock.textContent = S.day ? "🕒 DAY" : "🕒 NIGHT";
      weather.textContent = S.day ? "🌬" : "🌙";
      scene.classList.toggle("night", !S.day);
      scene.classList.toggle("day", S.day);
      if(!S.day) S.alert = clamp(S.alert + 8, 0, 100);
    }

    setSpriteByMode();
    showBookIfAnyEscape();
    requestAnimationFrame(tick);
  }

  // --- Actions ---
  function doEscape(){
    const A = currentAnimal();
    S.mode = "ESCAPE";

    // unlock: trigger (after escape)
    S.unlock[S.animalKey].trigger = true;
    S.escapedOnce[S.animalKey] = true;

    // If escaped while B (monkey), mark as "met once"
    if(S.animalKey === "B") S.metOnce.B = true;

    animal.style.opacity = "0";
    setSpriteByMode();

    setTimeout(() => {
      escapeLine.textContent = A.escapeLine;
      escapeOverlay.classList.add("show");
      bookBtn.classList.add("show");
      renderEncyclopedia();
    }, 420);
  }

  function restart(){
    escapeOverlay.classList.remove("show");
    animal.style.opacity = "1";

    S.zoom = 1;
    S.stress = (S.animalKey==="A") ? 15 : 20;
    S.alert  = (S.animalKey==="A") ? 10 : 14;
    S.mode   = "IDLE";
    S.tapBurst = 0;
    S.seenNatural = 0;
    S.lastActionAt = Date.now();

    setZoom(1);
    randomMove();
    flashMsg("……");
    setSpriteByMode();
    showBookIfAnyEscape();
    renderEncyclopedia();
  }

  function approach(){
    if(S.mode==="ESCAPE") return;
    const A = currentAnimal();
    registerAction();

    setZoom(S.zoom + 1);

    S.stress = clamp(S.stress + A.approachStress, 0, 100);
    S.alert  = clamp(S.alert  + A.approachAlert, 0, 100);
    flashMsg("気づいた");

    // tap burst = chasing/petting impulse
    S.tapBurst++;
    clearTimeout(S.tapBurstTimer);
    S.tapBurstTimer = setTimeout(()=>S.tapBurst=0, 900);

    // Escape logic differs:
    if(S.animalKey==="A"){
      // Cat: close + repeated taps quickly becomes fatal
      if(S.tapBurst >= 3 && S.zoom >= 2) S.stress = clamp(S.stress + 26, 0, 100);
      if(S.stress > 80 || (S.tapBurst >= 4 && S.zoom >= 2)) doEscape();
    } else {
      // Monkey: not instantly fatal by closeness, but noisy interaction piles up
      if(S.tapBurst >= 5 && S.zoom >= 2) S.alert = clamp(S.alert + 25, 0, 100);
      // also: if already uneasy, repeated interaction pushes escape
      if(S.alert > 80) doEscape();
    }
  }

  function stepBack(){
    if(S.mode==="ESCAPE") return;
    registerAction();
    setZoom(S.zoom - 1);
    S.stress = clamp(S.stress - 8, 0, 100);
    S.alert  = clamp(S.alert  - 8, 0, 100);
    flashMsg("距離をとった");
  }

  function switchAnimal(){
    // Only allow switching when not in overlays
    if(escapeOverlay.classList.contains("show") || bookOverlay.classList.contains("show")) return;

    // If switching to B first time, mark "met" when you actually switch
    const next = (S.animalKey==="A") ? "B" : "A";
    S.animalKey = next;
    if(next==="B") S.metOnce.B = true;

    // reset momentary state but keep knowledge
    S.zoom = 1;
    S.stress = (next==="A") ? 15 : 20;
    S.alert  = (next==="A") ? 10 : 14;
    S.mode   = "IDLE";
    S.tapBurst = 0;
    S.seenNatural = 0;
    S.lastActionAt = Date.now();

    titlePill.textContent = (next==="A") ? "Manul" : "Field";
    setZoom(1);
    animal.style.opacity="1";
    randomMove();
    flashMsg("……");
    setSpriteByMode();
  }

  // --- Events ---
  scene.addEventListener("pointerdown", (e) => {
    if(escapeOverlay.classList.contains("show")) return;
    if(bookOverlay.classList.contains("show")) return;

    const t = e.target;
    if(t===zoomIn || t===zoomOut || t===bookBtn || t===switchBtn) return;

    // tap anywhere to "approach" (tempting trap)
    approach();
  }, {passive:true});

  zoomIn.addEventListener("click", (e)=>{ e.stopPropagation(); approach(); });
  zoomOut.addEventListener("click",(e)=>{ e.stopPropagation(); stepBack(); });

  switchBtn.addEventListener("click",(e)=>{ e.stopPropagation(); switchAnimal(); });

  restartBtn.addEventListener("click", restart);
  escapeClose.addEventListener("click", ()=> escapeOverlay.classList.remove("show"));

  bookBtn.addEventListener("click",(e)=>{
    e.stopPropagation();
    renderEncyclopedia();
    bookOverlay.classList.add("show");
  });
  bookClose.addEventListener("click",()=> bookOverlay.classList.remove("show"));

  scene.addEventListener("wheel", (e) => {
    if(escapeOverlay.classList.contains("show") || bookOverlay.classList.contains("show")) return;
    e.preventDefault();
    if(e.deltaY < 0) approach();
    else stepBack();
  }, {passive:false});

  // Init
  setZoom(1);
  randomMove();
  titlePill.textContent = "Manul";
  renderEncyclopedia();
  showBookIfAnyEscape();
  flashMsg("（タップ＝近づく / 左下「切替」）", 1700);
  setSpriteByMode();

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>どうぶつ みまもり ゲーム</title>
    <style>
        body { font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif; margin: 0; padding: 0; background-color: #f0f8ff; overflow: hidden; touch-action: manipulation; }
        
        /* 画面レイアウト */
        #game-screen { display: flex; flex-direction: column; height: 100vh; }
        
        /* 上部情報バー */
        #status-bar { background: #ffd700; padding: 10px; text-align: center; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; }
        
        /* メイン画面（風景） */
        #scene { flex: 1; position: relative; background: linear-gradient(#87ceeb, #90ee90); transition: background 1s; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #scene.night { background: linear-gradient(#191970, #483d8b); } /* 夜の背景 */
        
        /* 動物の表示 */
        #animal { 
            width: 150px; height: 150px; 
            background-color: #ccc; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 5rem; cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
        }
        .hidden { opacity: 0; pointer-events: none; } /* 隠れている状態 */
        
        /* 隠れ場所（岩や木など） */
        #hiding-spot {
            position: absolute; bottom: 20%; width: 200px; height: 100px;
            background: #555; border-radius: 50px 50px 0 0;
            display: none; color: white; text-align: center; line-height: 100px;
        }

        /* メッセージエリア */
        #message-box { 
            background: rgba(255,255,255,0.9); padding: 10px; 
            text-align: center; height: 60px; font-size: 1rem; 
            border-top: 2px solid #333;
        }

        /* 操作パネル */
        #controls { background: #fff; padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; border-top: 1px solid #ccc; }
        button { 
            padding: 15px 5px; font-size: 1rem; border: 2px solid #333; border-radius: 10px; background: #fff; cursor: pointer; 
            font-family: inherit;
        }
        button:active { background: #ddd; }
        .action-btn { background: #ffefd5; }
        .move-btn { background: #e0ffff; font-weight: bold; }

        /* スタート画面など */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .hidden-screen { display: none; }
        h1 { margin-bottom: 20px; }
        .area-btn { margin: 10px; padding: 15px 30px; font-size: 1.2rem; background: orange; border: none; border-radius: 20px; color: white; }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1>どうぶつ みまもり</h1>
        <p>あそぶ ばしょ を えらんでね</p>
        <button class="area-btn" onclick="startGame('sougen')">そうげん</button>
        <button class="area-btn" onclick="startGame('jungle')">ジャングル</button>
        </div>

    <div id="result-screen" class="overlay hidden-screen">
        <h1 id="result-title">なかよくなれた！</h1>
        <div id="result-content" style="text-align:center; padding: 20px;"></div>
        <button class="area-btn" onclick="location.reload()">もういちど あそぶ</button>
    </div>

    <div id="game-screen">
        <div id="status-bar">
            <span id="day-display">1にちめ</span>
            <span id="time-icon">☀️</span>
            <span id="dist-display">きょり: 50m</span>
        </div>

        <div id="scene">
            <div id="hiding-spot">いわかげ</div>
            <div id="animal">❓</div>
        </div>

        <div id="message-box">
            どうぶつ が 現れた！<br>
            まだ 正体は わからない…
        </div>

        <div id="controls">
            <button class="move-btn" onclick="changeDistance(-10)">▲ ちかづく</button>
            <button class="action-btn" onclick="doAction('hand')">🖐️ なでる</button>
            <button class="action-btn" onclick="doAction('stone')">🪨 いし</button>
            
            <button class="move-btn" onclick="changeDistance(10)">▼ はなれる</button>
            <button class="action-btn" onclick="doAction('branch')">🌿 きのえだ</button>
            <button class="action-btn" onclick="checkEncyclopedia()">📖 ずかん</button>
        </div>
    </div>

<script>
    // --- ゲーム設定データ ---
    const animals = {
        'sougen': {
            id: 'manuru',
            name: 'マヌルネコ',
            unknownName: 'ねこ っぽい ぞ！',
            emoji: '🐱',
            waryDist: 30, // 警戒距離（これより近づくと隠れる）
            likeAction: 'branch', // 好むアクション（例）
            hateAction: 'stone', // 嫌うアクション
            desc: 'ずんぐり むっくり している ねこ。寒い ところが すき。'
        },
        'jungle': {
            id: 'okapi',
            name: 'オカピ',
            unknownName: 'うま っぽい ぞ！',
            emoji: '🦓',
            waryDist: 40,
            likeAction: 'branch',
            hateAction: 'stone',
            desc: 'しまうま に にているけど キリン の なかま。'
        }
    };

    // --- 変数 ---
    let currentArea = '';
    let targetAnimal = null;
    let distance = 50; // 初期距離m
    let days = 1;
    let timeCount = 0; // 0-10:昼, 10-20:夜
    let isNight = false;
    let isHiding = false;
    let trust = 0; // 信頼度（内部パラメータ）
    let gameActive = false;
    let timerInterval = null;
    let angryMode = false; // 石を投げられて怒った状態

    // --- ゲーム開始 ---
    function startGame(area) {
        currentArea = area;
        targetAnimal = animals[area];
        
        // 図鑑チェック（クリア済みなら最初から正体判明）
        const isUnlocked = localStorage.getItem('unlocked_' + targetAnimal.id);
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('animal').innerText = isUnlocked ? targetAnimal.emoji : "❓";
        
        const initialMsg = isUnlocked ? 
            `あっ！ ${targetAnimal.name} だ！` : 
            `${targetAnimal.unknownName} (正体不明)`;
        
        showMessage(initialMsg);

        gameActive = true;
        distance = 50;
        updateDisplay();
        
        // 時間進行スタート
        timerInterval = setInterval(gameLoop, 1000);
    }

    // --- メインループ (1秒ごとに実行) ---
    function gameLoop() {
        if (!gameActive) return;

        timeCount++;
        
        // 昼夜切り替え
        if (timeCount === 10) {
            isNight = true;
            document.getElementById('scene').classList.add('night');
            document.getElementById('time-icon').innerText = '🌙';
            showMessage("よる に なった…");
        } else if (timeCount === 20) {
            isNight = false;
            document.getElementById('scene').classList.remove('night');
            document.getElementById('time-icon').innerText = '☀️';
            days++;
            timeCount = 0;
            document.getElementById('day-display').innerText = days + "にちめ";
            showMessage("あさ に なった！");
            
            // 3日経過でクリア判定
            if (days > 3 && !angryMode) {
                gameClear();
            }
        }

        // 隠れていて、距離を十分取っていたら出てくる
        if (isHiding && distance > targetAnimal.waryDist + 10 && !angryMode) {
            isHiding = false;
            drawScene();
            showMessage("どうぶつ が そっと かお を だした…");
        }
    }

    // --- アクション処理 ---
    function changeDistance(delta) {
        if (!gameActive) return;
        distance += delta;
        if (distance < 0) distance = 0;
        if (distance > 100) distance = 100;
        
        updateDisplay();

        // 警戒判定
        if (distance < targetAnimal.waryDist && !isHiding) {
            animalHides();
        }
    }

    function doAction(type) {
        if (!gameActive) return;
        if (isHiding) {
            showMessage("いまは かくれている みたい…");
            return;
        }

        if (type === 'stone') {
            // 石を投げる（ゲームオーバー要素だが、今回は「二度と出てこない」状態にする）
            showMessage("石を 投げた！ どうぶつ は 怒って 逃げ出した！");
            angryMode = true;
            animalHides();
            // 教育的メッセージ
            setTimeout(() => alert("どうぶつ を いじめては いけません。もう でてこないかも…"), 500);
            endGame(false);
        } else if (type === 'hand') {
            if (distance > 5) {
                showMessage("とおくて とどかない よ。");
            } else {
                showMessage("そっと ふれた。あったかい！");
                trust += 10;
            }
        } else if (type === 'branch') {
             showMessage("えだ で つついてみた。");
             // 動物ごとの反応（簡易実装）
             showMessage("キョトン と している。");
        }
    }

    function animalHides() {
        isHiding = true;
        drawScene();
        if(!angryMode) {
            showMessage("警戒して かくれて しまった！ はなれて まとう。");
        }
    }

    // --- 描画・UI更新 ---
    function updateDisplay() {
        document.getElementById('dist-display').innerText = `きょり: ${distance}m`;
        
        // 距離に応じて動物のサイズを変える（遠近法）
        const scale = 1 + (100 - distance) / 50; 
        document.getElementById('animal').style.transform = `scale(${scale})`;
    }

    function drawScene() {
        const animalEl = document.getElementById('animal');
        const hideEl = document.getElementById('hiding-spot');
        
        if (isHiding) {
            animalEl.classList.add('hidden');
            hideEl.style.display = 'block';
        } else {
            animalEl.classList.remove('hidden');
            hideEl.style.display = 'none';
        }
    }

    function showMessage(text) {
        document.getElementById('message-box').innerHTML = text;
    }

    // --- ゲームクリア・終了 ---
    function gameClear() {
        gameActive = false;
        clearInterval(timerInterval);
        
        // 実績解除保存
        localStorage.setItem('unlocked_' + targetAnimal.id, 'true');
        
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden-screen');
        
        let html = `<p>3かかん いっしょに すごせたね！</p>`;
        html += `<h2>${targetAnimal.name}</h2>`;
        html += `<div style="font-size:4rem">${targetAnimal.emoji}</div>`;
        html += `<p>${targetAnimal.desc}</p>`;
        html += `<p style="color:yellow">★ だいこうぶつ を GET！</p>`;
        
        document.getElementById('result-content').innerHTML = html;
    }

    function endGame(success) {
        if (!success) {
            // 失敗時はリロードボタンを出すなどの処理（今回は簡易的にそのまま）
        }
    }
    
    // 図鑑（簡易版）
    function checkEncyclopedia() {
        let msg = "【ずかん】\n";
        if (localStorage.getItem('unlocked_manuru')) msg += "★マヌルネコ (解放済み)\n";
        else msg += "・???? (草原)\n";
        
        if (localStorage.getItem('unlocked_okapi')) msg += "★オカピ (解放済み)\n";
        else msg += "・???? (ジャングル)\n";
        
        alert(msg);
    }

</script>
</body>
</html>

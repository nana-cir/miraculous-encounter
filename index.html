<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>どうぶつ みまもり ゲーム</title>
    <style>
        /* 基本設定 */
        body { 
            font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif; 
            margin: 0; padding: 0; 
            background-color: #f0f8ff; 
            overflow: hidden; 
            touch-action: manipulation; 
        }
        
        #game-screen { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
        }
        
        /* 上部情報バー */
        #status-bar { background: #ffd700; padding: 10px; text-align: center; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}
        
        /* メイン画面 */
        #scene { flex: 1; position: relative; background: linear-gradient(#87ceeb, #90ee90); transition: background 1s; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #scene.night { background: linear-gradient(#191970, #483d8b); }
        
        /* 動物 */
        #animal { 
            width: 150px; height: 150px; 
            background-color: rgba(255,255,255,0.9); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 5rem; 
            transition: all 0.5s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 3px solid #fff;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* ハートのエフェクト */
        .heart-anim {
            position: absolute;
            top: -50px;
            font-size: 3rem;
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* 隠れ場所 */
        #hiding-spot {
            position: absolute; bottom: 15%; width: 220px; height: 120px;
            background: #6b8e23; border-radius: 60% 60% 0 0;
            display: none; color: white; text-align: center; line-height: 120px; font-weight: bold;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2);
        }

        /* メッセージエリア */
        #message-box { 
            background: #fff; padding: 15px 10px; 
            text-align: center; min-height: 50px; font-size: 1.1rem; 
            border-top: 3px solid #ffd700; display: flex; align-items: center; justify-content: center;
        }

        /* 操作パネル */
        #controls { 
            background: #f9f9f9; padding: 15px 10px; 
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; 
            border-top: 1px solid #eee; 
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }
        button { 
            padding: 10px 2px; font-size: 0.95rem; border: 2px solid #ccc; border-radius: 12px; background: #fff; cursor: pointer; 
            font-family: inherit; font-weight: bold; color: #555;
            box-shadow: 0 3px 0 #ccc; transition: all 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: translateY(3px); }

        .action-btn { background: #fffbe6; border-color: #ebd8a0; box-shadow: 0 3px 0 #ebd8a0; color: #7f6a3e; }
        .move-btn { background: #e6ffff; border-color: #a0ebeb; box-shadow: 0 3px 0 #a0ebeb; color: #3e7f7f; }
        .danger-btn { background: #ffe6e6; border-color: #eba0a0; box-shadow: 0 3px 0 #eba0a0; color: #7f3e3e; }
        
        /* 特別なエサボタン */
        .food-btn { 
            background: #ffb6c1; border-color: #ff69b4; box-shadow: 0 3px 0 #ff69b4; color: #c71585; 
            grid-column: 2 / 3; /* 中央に配置 */
            display: none; /* 最初は非表示 */
        }

        /* オーバーレイ共通 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .hidden-screen { display: none; }
        h1 { margin-bottom: 30px; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .area-btn { margin: 10px; padding: 15px 40px; font-size: 1.3rem; background: orange; border: none; border-radius: 30px; color: white; box-shadow: 0 5px 0 #cc8400; width: 80%; max-width: 300px; }
        .link-btn { background: #0091ca; box-shadow: 0 5px 0 #005f85; font-size: 1rem; padding: 12px; margin-top: 20px;}
    </style>
</head>
<body>

    <div id="start-screen" class="overlay">
        <h1>どうぶつ みまもり</h1>
        <p style="margin-bottom: 20px;">あそぶ ばしょ を えらんでね</p>
        <button class="area-btn" onclick="startGame('sougen')">🌾 そうげん</button>
        <button class="area-btn" onclick="startGame('jungle')">🌴 ジャングル</button>
    </div>

    <div id="result-screen" class="overlay hidden-screen">
        <h1 id="result-title">なかよくなれた！</h1>
        <div id="result-content" style="text-align:center; padding: 20px; background:rgba(255,255,255,0.2); border-radius: 20px; margin-bottom: 20px;"></div>
        <button class="area-btn link-btn" onclick="openWWF()">🌏 くわしく しらべる (WWF)</button>
        <button class="area-btn" onclick="location.reload()">もういちど あそぶ</button>
    </div>
    
    <div id="gameover-screen" class="overlay hidden-screen" style="background: rgba(50,0,0,0.9);">
        <h1>ざんねん…</h1>
        <div style="font-size: 5rem; margin: 20px;">💢</div>
        <p>どうぶつ は おこって<br>どこかへ いってしまった。</p>
        <button class="area-btn" style="background:#d9534f; margin-top:30px;" onclick="location.reload()">タイトルへ もどる</button>
    </div>

    <div id="game-screen">
        <div id="status-bar">
            <span id="day-display">1にちめ</span>
            <span id="time-icon">☀️</span>
            <span id="dist-display">きょり: 50m</span>
        </div>

        <div id="scene">
            <div id="hiding-spot">🌿 くさむら</div>
            <div id="animal">❓</div>
        </div>

        <div id="message-box">
            どうぶつ が 現れた！<br>
            まだ 正体は わからない…
        </div>

        <div id="controls">
            <button class="move-btn" onclick="changeDistance(-10)">▲ ちかづく</button>
            <button class="action-btn" id="btn-pet" onclick="doAction('hand')">🖐️ なでる</button>
            <button class="danger-btn" id="btn-stone" onclick="doAction('stone')">🪨 いし</button>
            
            <button class="move-btn" onclick="changeDistance(10)">▼ はなれる</button>
            <button class="action-btn" onclick="doAction('branch')">🌿 きのえだ</button>
            <button class="action-btn" style="background:#f0f0ff; border-color:#a0a0eb; color:#5a5a9f;" onclick="checkEncyclopedia()">📖 ずかん</button>

            <div style="grid-column: 1 / 4; display:flex; justify-content:center;">
                <button id="btn-food" class="food-btn" style="width:100%; max-width:200px;" onclick="doAction('food')">🍖 ごほうびのエサ をあげる</button>
            </div>
        </div>
    </div>

<script>
    // --- データ ---
    const animals = {
        'sougen': {
            id: 'manuru',
            name: 'マヌルネコ',
            unknownName: 'ねこ っぽい ぞ！',
            emoji: '🐱',
            foodName: '🥩 おにく',
            waryDist: 35,
            hidingPlace: '🌿 くさむら',
            desc: 'ずんぐり むっくり している ねこ。寒い ところが すき。'
        },
        'jungle': {
            id: 'okapi',
            name: 'オカピ',
            unknownName: 'うま っぽい ぞ！',
            emoji: '🦓',
            foodName: '🥬 はっぱ',
            waryDist: 45,
            hidingPlace: '🌳 しげみ',
            desc: 'あし の しまもよう が おしゃれ。キリン の なかま。'
        }
    };

    let currentArea = '';
    let targetAnimal = null;
    let distance = 50;
    let days = 1;
    let timeCount = 0;
    let isNight = false;
    let isHiding = false;
    let gameActive = false;
    let timerInterval = null;
    let angryMode = false;
    let isUnlocked = false; // クリア済みか
    let isFed = false; // 今回エサをあげたか

    function startGame(area) {
        currentArea = area;
        targetAnimal = animals[area];
        
        // クリア済みチェック
        isUnlocked = localStorage.getItem('unlocked_' + targetAnimal.id) === 'true';
        
        document.getElementById('start-screen').style.display = 'none';
        
        // 正体表示設定
        document.getElementById('animal').innerText = isUnlocked ? targetAnimal.emoji : "❓";
        document.getElementById('hiding-spot').innerText = targetAnimal.hidingPlace;
        
        // ボタン制御
        if (isUnlocked) {
            // クリア済みならエサボタンを表示
            const foodBtn = document.getElementById('btn-food');
            foodBtn.style.display = 'block';
            foodBtn.innerText = targetAnimal.foodName + " をあげる";
            
            // 石ボタンは隠す（友達なので）
            document.getElementById('btn-stone').style.visibility = 'hidden';
            
            showMessage(`あっ！ ${targetAnimal.name} だ！<br>また 会えたね！`);
        } else {
            showMessage(`${targetAnimal.unknownName} (正体不明)<br>そっと 見守ろう。`);
        }

        gameActive = true;
        distance = 50;
        updateDisplay();
        
        timerInterval = setInterval(gameLoop, 1000);
    }

    function gameLoop() {
        if (!gameActive) return;

        timeCount++;
        
        if (timeCount === 10) {
            isNight = true;
            document.getElementById('scene').classList.add('night');
            document.getElementById('time-icon').innerText = '🌙';
            showMessage("よる に なった…");
        } else if (timeCount === 20) {
            isNight = false;
            document.getElementById('scene').classList.remove('night');
            document.getElementById('time-icon').innerText = '☀️';
            days++;
            timeCount = 0;
            document.getElementById('day-display').innerText = days + "にちめ";
            showMessage("あさ に なった！");
            
            if (days > 3 && !angryMode) {
                gameClear();
            }
        }

        // 隠れている時の処理
        if (isHiding && distance > targetAnimal.waryDist + 10 && !angryMode) {
            isHiding = false;
            drawScene();
            showMessage("どうぶつ が そっと かお を だした…");
        }
    }

    function changeDistance(delta) {
        if (!gameActive) return;
        distance += delta;
        if (distance < 0) distance = 0;
        if (distance > 100) distance = 100;
        updateDisplay();

        // 警戒判定（エサをあげていれば警戒しない！）
        if (!isFed && distance < targetAnimal.waryDist && !isHiding) {
            animalHides();
        }
    }

    function doAction(type) {
        if (!gameActive) return;
        if (isHiding) {
            showMessage("いまは かくれている みたい…");
            return;
        }

        if (type === 'stone') {
            showMessage("石を 投げた！ どうぶつ は 激怒して 去っていった！");
            angryMode = true;
            animalHides();
            setTimeout(() => endGame(false), 1500);
            
        } else if (type === 'food') {
            // エサやり機能
            if (!isUnlocked) return; // 本来ありえないが念のため
            
            showMessage(`${targetAnimal.foodName} を 置いてみた…`);
            
            // 少し遅れて反応
            setTimeout(() => {
                distance = 2; // 目の前へ！
                isFed = true; // 仲良しモード
                updateDisplay();
                showMessage(`「くんくん…！」<br>${targetAnimal.name} が うれしそうに 近寄ってきた！`);
                // エサボタンを消す
                document.getElementById('btn-food').style.display = 'none';
            }, 1000);

        } else if (type === 'hand') {
            if (distance > 5) {
                showMessage("とおくて とどかない よ。");
            } else if (isUnlocked && !isFed) {
                // クリア済みでも、エサをあげてないと少し警戒する演出
                showMessage("まだ 少し 警戒しているみたい。<br>好物 を あげてみよう！");
            } else {
                // なでる成功！
                showMessage("よしよし！<br>とっても うれしそう！");
                showHeart();
            }
            
        } else if (type === 'branch') {
             showMessage("えだ で つついてみた。");
             if(isFed) {
                 showMessage("じゃれついて 遊んでいる！");
             } else {
                 showMessage("ビクッとして 離れてしまった。");
                 distance += 15;
                 updateDisplay();
             }
        }
    }
    
    // ハートのエフェクト
    function showHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart-anim');
        heart.innerText = '💖';
        document.getElementById('animal').appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
    }

    function animalHides() {
        isHiding = true;
        drawScene();
        if(!angryMode) showMessage(`警戒して かくれて しまった！`);
    }

    function updateDisplay() {
        document.getElementById('dist-display').innerText = `きょり: ${distance}m`;
        let scale = 1 + (100 - distance) / 60; 
        if (distance < 5) scale = 3.5; // 至近距離は大きく
        document.getElementById('animal').style.transform = `scale(${scale})`;
    }

    function drawScene() {
        const animalEl = document.getElementById('animal');
        const hideEl = document.getElementById('hiding-spot');
        if (isHiding) {
            animalEl.classList.add('hidden');
            hideEl.style.display = 'block';
        } else {
            animalEl.classList.remove('hidden');
            hideEl.style.display = 'none';
        }
    }

    function showMessage(text) {
        document.getElementById('message-box').innerHTML = text;
    }

    function gameClear() {
        gameActive = false;
        clearInterval(timerInterval);
        
        // 初回クリアならフラグ保存
        if (!localStorage.getItem('unlocked_' + targetAnimal.id)) {
            localStorage.setItem('unlocked_' + targetAnimal.id, 'true');
        }
        
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden-screen');
        
        let html = `<p>3かかん いっしょに すごせたね！</p>`;
        html += `<h2>${targetAnimal.name}</h2>`;
        html += `<div style="font-size:6rem; margin:10px;">${targetAnimal.emoji}</div>`;
        html += `<p>${targetAnimal.desc}</p>`;
        
        // 今回初めてクリアした時だけ表示
        if (!isUnlocked) {
             html += `<p style="color:orange; font-weight:bold; margin-top:10px;">★ ${targetAnimal.foodName} を GET！</p>`;
             html += `<p style="font-size:0.8rem;">また遊ぶと エサやり ができるよ！</p>`;
        }
        
        document.getElementById('result-content').innerHTML = html;
    }

    function endGame(success) {
        gameActive = false;
        clearInterval(timerInterval);
        if (!success) document.getElementById('gameover-screen').classList.remove('hidden-screen');
    }
    
    function checkEncyclopedia() {
        // 図鑑機能でもWWFリンクを表示するか確認
        if(confirm("【ずかん】\n\nあつめた どうぶつ を\nWWFのサイトで しらべる？")) {
            openWWF();
        }
    }

    // WWFへのリンク（新しいタブで開く）
    function openWWF() {
        window.open('https://www.wwf.or.jp/activities/basicinfo/5777.html', '_blank');
    }
</script>
</body>
</html>
